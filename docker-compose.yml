name: pulse-platform
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/setup.mjs}
    ports: ["127.0.0.1:55432:5432"]
    volumes: [pulse_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U pulse -d pulse"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
    volumes: [pulse_queue:/data]
    command: ["redis-server","--appendonly","yes"]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 3s
      timeout: 3s
      retries: 30
  mail:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:58025:8025","127.0.0.1:51025:1025"]
  api:
    ports: ["127.0.0.1:4100:4100"]
    profiles: [app]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pulse:${POSTGRES_PASSWORD}@postgres:5432/pulse
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SMTP_HOST: ${COMPOSE_SMTP_HOST:-mail}
      SMTP_PORT: ${COMPOSE_SMTP_PORT:-1025}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD","node","-e","fetch('http://localhost:4100/api/v1/health').then(r=>process.exit(+!r.ok)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    profiles: [app]
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports: ["127.0.0.1:3100:3100"]
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3100/api/v1/health').then(r=>process.exit(+!r.ok)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
    depends_on:
      api: {condition: service_healthy}
volumes:
  pulse_pg:
  pulse_queue:
